[Discord]
## HTTPS Discord webhook endpoint. Leave blank until this server has a webhook.
# Setting type: String
# Default value:
WebhookUrl =

## Webhook timeout in seconds. Values outside 1 through 30 use the safe default of 5 seconds.
# Setting type: Int32
# Default value: 5
TimeoutSeconds = 5

[Messages]
## Discord message sent after the dedicated server finishes generating its world.
# Setting type: String
# Default value: Valheim server is ready.
ServerReady = Valheim server is ready.

## Discord message sent for a normal Valheim shutdown.
# Setting type: String
# Default value: Valheim server is stopping.
ServerStopping = Valheim server is stopping.
